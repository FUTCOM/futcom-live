<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTCOM - Música de Fundo</title>
<style>
body{margin:0;min-height:100vh;background:#050505;color:white;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}
.player{width:min(500px,90%);text-align:center;padding:35px;border:1px solid #222;border-radius:20px;background:#0b0b0b;box-shadow:0 0 40px rgba(255,255,255,.04)}
h1{letter-spacing:5px;margin:0 0 8px} p{color:#999;margin:0 0 25px}
.disc{width:130px;height:130px;margin:0 auto 25px;border-radius:50%;border:2px solid #333;background:radial-gradient(circle,#111 0 18%,#333 19% 21%,#111 22% 45%,#222 46% 48%,#111 49%);animation:girar 8s linear infinite;animation-play-state:paused}
.disc.tocando{animation-play-state:running}
@keyframes girar{to{transform:rotate(360deg)}}
button{border:0;border-radius:12px;padding:13px 25px;font-size:16px;cursor:pointer}
.volume{margin-top:22px} input{width:100%} #estado{margin-top:15px;color:#aaa;font-size:14px}
</style>
</head>
<body>
<div class="player">
<div id="disco" class="disc"></div>
<h1>FUTCOM</h1>
<p>Música de fundo tranquila</p>

<!-- COLOCA O TEU FICHEIRO DE MÚSICA NA MESMA PASTA E DÁ-LHE O NOME: musica.mp3 -->
<audio id="musica" loop preload="auto">
<source src="musica.mp3" type="audio/mpeg">
</audio>

<button id="botao" onclick="alternarMusica()">▶ Tocar música</button>

<div class="volume">🔊 <input id="volume" type="range" min="0" max="1" step="0.01" value="0.25"></div>
<div id="estado">Música pronta</div>
</div>

<script>
const musica=document.getElementById("musica");
const botao=document.getElementById("botao");
const volume=document.getElementById("volume");
const disco=document.getElementById("disco");
const estado=document.getElementById("estado");

musica.volume=0.25;
volume.addEventListener("input",()=>musica.volume=Number(volume.value));

function alternarMusica(){
 if(musica.paused){
  musica.play().then(()=>{
   botao.textContent="⏸ Pausar música";
   estado.textContent="Música a tocar";
   disco.classList.add("tocando");
  }).catch(()=>estado.textContent="Clica novamente para iniciar a música.");
 }else{
  musica.pause();
  botao.textContent="▶ Tocar música";
  estado.textContent="Música pausada";
  disco.classList.remove("tocando");
 }
}
</script>
</body>
</html>
